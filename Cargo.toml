[package]
name = "anyr-cli"
version = "0.1.44" # x-release-please-version
edition = "2021"
rust-version = "1.89"
description = "AnyRouter CLI — native binary"
license = "MIT"
repository = "https://github.com/AnyRouterHQ/cli"
homepage = "https://anyrouter.dev/cli"
publish = false

[[bin]]
name = "anyr"
path = "src/main.rs"
required-features = ["native"]

[lib]
name = "anyr_cli"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = ["native"]
native = ["dep:ureq", "dep:ratatui", "dep:crossterm", "dep:tungstenite", "dep:idna_adapter"]

[dependencies]
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
unicode-width = "0.2"
# Inflates the packed help pages (build.rs); already linked through ureq gzip.
miniz_oxide = "0.9"
ureq = { version = "2.12", optional = true }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "=0.28.1", optional = true }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }
# Stub IDNA back end for url (via ureq): drops the ICU4X tables, -121,256 bytes
# stripped. Unicode hostnames must be written in punycode (xn--...).
idna_adapter = { version = "=1.0.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"

[profile.release]
# Fat LTO + opt-level "z": linux x86_64 4.03 MB -> 3.27 MB (-19%) with no
# measurable change in startup (~1.1 ms) or HTTPS command time.
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[build-dependencies]
miniz_oxide = "0.9"

[dev-dependencies]
vt100 = "0.15"
