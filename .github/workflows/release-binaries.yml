name: release-binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to build and upload (e.g. v0.1.10)
        required: true
        type: string

permissions:
  contents: write

# Upload retry is inlined in each gh release upload step so
# workflow_dispatch of an older tag still uploads. The tag checkout used
# to compile binaries may not contain helper scripts added later.

jobs:
  build:
    # release: only non-prerelease; workflow_dispatch: always (tag input)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: anyr-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            asset: anyr-linux-arm64
            target: aarch64-unknown-linux-gnu
          # Static builds for Alpine and old glibc (setup.sh GLIBC_BASELINE).
          - os: ubuntu-latest
            asset: anyr-linux-x86_64-musl
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            asset: anyr-linux-arm64-musl
            target: aarch64-unknown-linux-musl
          # Cross-compile Intel Mac from Apple Silicon — macos-13 is unavailable
          # and was leaving release-binaries queued forever (empty stable assets).
          - os: macos-latest
            asset: anyr-darwin-x86_64
            target: x86_64-apple-darwin
          - os: macos-latest
            asset: anyr-darwin-arm64
            target: aarch64-apple-darwin
          - os: windows-latest
            asset: anyr-windows-x86_64.exe
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Compile the tagged source. Scripts used only after this step
          # (bench.py) exist on historical tags; upload retry is inlined.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ring compiles C for the target; musl-gcc is the musl C compiler.
      - name: install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      - name: cargo build --release
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: package asset
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/anyr"
          if [ -f "target/${{ matrix.target }}/release/anyr.exe" ]; then
            bin="target/${{ matrix.target }}/release/anyr.exe"
          fi
          strip "$bin" 2>/dev/null || true
          # Apple Silicon kills (SIGKILL, no message) any binary whose code
          # signature does not match its bytes. The linker ad-hoc signs, then
          # strip rewrites the file and breaks that signature. Re-sign last.
          if [ "$(uname -s)" = "Darwin" ]; then
            codesign --force --sign - "$bin"
            codesign --verify --verbose=2 "$bin"
          fi
          test -s "$bin" || { echo "missing built binary $bin" >&2; exit 1; }
          cp "$bin" "${{ matrix.asset }}"
          test -s "${{ matrix.asset }}" || { echo "empty asset ${{ matrix.asset }}" >&2; exit 1; }

      # Inlined (not scripts/smoke-binary.sh): a workflow_dispatch rebuild of an
      # older tag checks out source that predates that script.
      - name: smoke the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          f="./${{ matrix.asset }}"
          chmod +x "$f"
          if [ "$(uname -s)" = "Darwin" ]; then
            codesign --verify --strict --verbose=2 "$f"
          fi
          "$f" --version
          "$f" --help >/dev/null

      # The agent-contract smoke, when the tagged source has it (older tags
      # predate scripts/smoke.sh). Mock API tier on Linux and macOS.
      - name: smoke the agent contract
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/smoke.sh ]; then
            bash scripts/smoke.sh "./${{ matrix.asset }}" ${{ runner.os != 'Windows' && '--mock' || '' }}
          else
            echo "scripts/smoke.sh not in this tag; skipped"
          fi

      - name: bench
        shell: bash
        run: |
          python scripts/bench.py measure \
            --bin "${{ matrix.asset }}" \
            --asset "${{ matrix.asset }}" \
            --target "${{ matrix.target }}" \
            --os "${{ matrix.os }}" \
            --kind native \
            --out "bench/${{ matrix.asset }}.json"

      - name: upload ${{ matrix.asset }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          n=1
          while true; do
            if out=$(gh release upload "${RELEASE_TAG}" "${{ matrix.asset }}" --clobber 2>&1); then
              printf '%s\n' "$out"
              break
            fi
            printf '%s\n' "$out" >&2
            if ! printf '%s\n' "$out" | grep -qi 'release not found'; then
              exit 1
            fi
            if [ "$n" -ge 3 ]; then
              echo "gh release upload failed: release not found after 3 attempts (${RELEASE_TAG})" >&2
              exit 1
            fi
            sleep $((n * 5))
            n=$((n + 1))
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.asset }}
          path: bench/${{ matrix.asset }}.json

  wasm:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Prebuilt binary. Keep the pin equal to wasm-bindgen in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.100

      - name: cargo build wasm
        run: cargo build --release --target wasm32-unknown-unknown --no-default-features

      - name: wasm-bindgen + size bench
        run: |
          wasm-bindgen --target web --out-dir target/wasm-pkg \
            target/wasm32-unknown-unknown/release/anyr_cli.wasm
          cp target/wasm-pkg/anyr_cli_bg.wasm anyr.wasm
          python scripts/bench.py measure \
            --bin anyr.wasm \
            --asset anyr.wasm \
            --target wasm32-unknown-unknown \
            --kind wasm \
            --out bench/anyr.wasm.json

      - name: upload wasm assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          n=1
          while true; do
            if out=$(gh release upload "${RELEASE_TAG}" anyr.wasm --clobber 2>&1); then
              printf '%s\n' "$out"
              break
            fi
            printf '%s\n' "$out" >&2
            if ! printf '%s\n' "$out" | grep -qi 'release not found'; then
              exit 1
            fi
            if [ "$n" -ge 3 ]; then
              echo "gh release upload failed: release not found after 3 attempts (${RELEASE_TAG})" >&2
              exit 1
            fi
            sleep $((n * 5))
            n=$((n + 1))
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bench-anyr.wasm
          path: bench/anyr.wasm.json

  # Checksums must ship even when one platform (often Windows upload) fails.
  checksums:
    if: ${{ always() && !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false) }}
    needs: [build, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Workflow revision, not the tag: historical tags lack newer scripts.
          ref: ${{ github.sha }}

      - name: generate and upload checksums.txt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${RELEASE_TAG}" --dir dist --pattern 'anyr-*' || true
          count="$(find dist -maxdepth 1 -type f -name 'anyr-*' | wc -l | tr -d ' ')"
          echo "binaries on ${RELEASE_TAG}: ${count}"
          ls -la dist || true
          if [ "${count}" = "0" ]; then
            echo "hard gate: no anyr-* binaries on ${RELEASE_TAG}; cannot write checksums.txt" >&2
            exit 1
          fi
          ( cd dist && sha256sum anyr-* > checksums.txt )
          test -s dist/checksums.txt
          cat dist/checksums.txt
          n=1
          while true; do
            if out=$(gh release upload "${RELEASE_TAG}" dist/checksums.txt --clobber 2>&1); then
              printf '%s\n' "$out"
              break
            fi
            printf '%s\n' "$out" >&2
            if ! printf '%s\n' "$out" | grep -qi 'release not found'; then
              exit 1
            fi
            if [ "$n" -ge 3 ]; then
              echo "gh release upload failed: release not found after 3 attempts (${RELEASE_TAG})" >&2
              exit 1
            fi
            sleep $((n * 5))
            n=$((n + 1))
          done

  notes:
    if: ${{ always() && !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false) }}
    needs: [checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: write changelog + bench to release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          python scripts/bench.py report artifacts \
            --out bench-report.md --json-out bench-report.json \
            --title "Binary size and startup (${RELEASE_TAG})" || true
          python scripts/release_notes.py github \
            --tag "${RELEASE_TAG}" \
            --bench bench-report.md \
            --out notes.md
          gh release edit "${RELEASE_TAG}" --notes-file notes.md
          if [ -f bench-report.md ]; then
            n=1
            while true; do
              if out=$(gh release upload "${RELEASE_TAG}" \
                  bench-report.md bench-report.json --clobber 2>&1); then
                printf '%s\n' "$out"
                break
              fi
              printf '%s\n' "$out" >&2
              if ! printf '%s\n' "$out" | grep -qi 'release not found'; then
                exit 1
              fi
              if [ "$n" -ge 3 ]; then
                echo "gh release upload failed: release not found after 3 attempts (${RELEASE_TAG})" >&2
                exit 1
              fi
              sleep $((n * 5))
              n=$((n + 1))
            done
          fi
