name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release-please dispatches this on its PR branch (#157).
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run. Main keeps every run because
# each one publishes a beta numbered by run_number.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pushes that only touch docs, plans, README or skills still run lint but
  # build nothing and cut no beta. A manual dispatch (the release-please PR
  # gate, #157) and any compare failure count as a product change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.diff.outputs.product }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          product=true
          if [ "$EVENT" != workflow_dispatch ] && [ -n "${BASE//0/}" ]; then
            if files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" --paginate -q '.files[].filename')"; then
              printf '%s\n' "$files"
              printf '%s\n' "$files" | grep -qE '^(src/|scripts/|tests/|\.github/workflows/|Cargo\.toml$|Cargo\.lock$|build\.rs$|setup\.sh$|install\.ps1$)' \
                || product=false
            else
              echo "compare ${BASE}...${HEAD} failed; treating it as a product change"
            fi
          fi
          echo "product=${product}"
          echo "product=${product}" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # PRs restore main's cache but never save, so the 10 GB repo cache
      # holds one entry per job instead of one per branch.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: installer local-binary mode
        run: bash tests/setup-sh.test.sh

      - name: check co-author hook
        run: bash scripts/check-coauthors.sh

      - name: node wrapper syntax
        run: node --check scripts/npx-anyr.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: bench script syntax
        run: python -m py_compile scripts/bench.py scripts/release_notes.py scripts/stamp_beta_version.py

      - name: release notes
        run: python tests/release_notes_test.py

      - name: stamp beta version script
        run: python tests/stamp_beta_version_test.py

  # Reruns the whole suite under llvm-cov, so it reports coverage but does
  # not gate the beta; the plain linux x86_64 test leg does.
  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # tests/tty_render.rs drives anyr in a pseudo-terminal under each shell.
      - name: install shells for the terminal render tests
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish

      # Most tests wait on child processes and timers, so 16 threads on a
      # 4-core runner finish the suite in ~22s instead of ~36s at 4.
      - name: cargo llvm-cov nextest (full suite)
        env:
          ANYR_PTY_REQUIRE_SHELLS: "1"
          NEXTEST_PROFILE: ci
          NEXTEST_TEST_THREADS: "16"
        run: cargo llvm-cov nextest --locked --all-targets --lcov --output-path lcov.info

      # Repo secret CODECOV_TOKEN from https://app.codecov.io/gh/AnyRouterHQ/cli
      - uses: codecov/codecov-action@v5
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: cli
          name: anyr-cli
          fail_ci_if_error: true
          verbose: true

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  # Tests and release builds run as separate jobs so neither waits on the
  # other.
  test:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Also covers darwin-x86_64: that binary is cross-compiled on this
          # same arm64 runner, so its host tests would be a repeat.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # PRs restore main's cache but never save, so the 10 GB repo cache
      # holds one entry per job instead of one per branch.
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # tests/tty_render.rs drives anyr in a pseudo-terminal under each shell.
      - name: install shells for the terminal render tests (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish

      - name: install shells for the terminal render tests (macos)
        if: runner.os == 'macOS'
        run: brew install fish

      # Oversubscribed threads are measured on Linux only. macOS (3 vCPU,
      # already the flakiest leg) and Windows stay at one test per core.
      - name: cargo nextest run
        timeout-minutes: 20
        env:
          ANYR_PTY_REQUIRE_SHELLS: ${{ runner.os == 'Windows' && '0' || '1' }}
          NEXTEST_PROFILE: ci
          NEXTEST_TEST_THREADS: ${{ runner.os == 'Linux' && '16' || 'num-cpus' }}
        run: cargo nextest run --locked --all-targets

  build:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: anyr-linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            asset: anyr-linux-arm64
            target: aarch64-unknown-linux-gnu
          # Static builds for Alpine and for glibc older than the gnu builds
          # need (setup.sh GLIBC_BASELINE).
          - os: ubuntu-latest
            asset: anyr-linux-x86_64-musl
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            asset: anyr-linux-arm64-musl
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            asset: anyr-darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            asset: anyr-darwin-x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            asset: anyr-windows-x86_64.exe
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ring compiles C for the target; musl-gcc is the musl C compiler.
      - name: install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools

      # Keyed by target: both macOS legs share an OS and would collide.
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: stamp beta version (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/stamp_beta_version.py --run "${{ github.run_number }}"

      - name: cargo build --release
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: package + strip
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/anyr"
          if [ -f "target/${{ matrix.target }}/release/anyr.exe" ]; then
            bin="target/${{ matrix.target }}/release/anyr.exe"
          fi
          strip "$bin" 2>/dev/null || true
          # strip invalidates the linker's ad-hoc signature; Apple Silicon then
          # SIGKILLs the binary. Re-sign last.
          if [ "$(uname -s)" = "Darwin" ]; then
            codesign --force --sign - "$bin"
          fi
          cp "$bin" "${{ matrix.asset }}"
          ls -la "${{ matrix.asset }}"

      # Execute the exact file that will be published, on its own platform.
      # Offline checks on every leg; the mock API tier on Linux and macOS.
      - name: smoke the packaged binary
        shell: bash
        run: bash scripts/smoke.sh "${{ matrix.asset }}" ${{ runner.os != 'Windows' && '--mock' || '' }}

      - name: run the musl build in Alpine
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w \
            -e ANYR_NO_UPDATE=1 -e ANYR_TELEMETRY=0 -e ANYROUTER_HOME=/tmp/anyr \
            alpine:latest sh -euc '
              ./${{ matrix.asset }} --version
              ./${{ matrix.asset }} --help >/dev/null
              ./${{ matrix.asset }} schema | head -c 80; echo'

      # setup.sh sends glibc older than GLIBC_BASELINE to the musl build, so
      # the gnu build must not need a newer glibc than that.
      - name: glibc floor is at most setup.sh GLIBC_BASELINE
        if: endsWith(matrix.target, 'linux-gnu')
        run: |
          set -euo pipefail
          need="$(objdump -T "${{ matrix.asset }}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          have="$(sed -n 's/^GLIBC_BASELINE="\(.*\)"$/\1/p' setup.sh)"
          echo "${{ matrix.asset }} needs glibc ${need}; setup.sh GLIBC_BASELINE=${have}"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | tail -n 1)" != "$have" ]; then
            echo "raise GLIBC_BASELINE in setup.sh to ${need}"
            exit 1
          fi

      - name: bench size and startup
        shell: bash
        run: |
          python scripts/bench.py measure \
            --bin "${{ matrix.asset }}" \
            --asset "${{ matrix.asset }}" \
            --target "${{ matrix.target }}" \
            --os "${{ matrix.os }}" \
            --kind native \
            --out "bench/${{ matrix.asset }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            bench/${{ matrix.asset }}.json

  wasm:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: stamp beta version (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/stamp_beta_version.py --run "${{ github.run_number }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Prebuilt binary. Keep the pin equal to wasm-bindgen in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.100

      - name: cargo build wasm
        run: cargo build --release --target wasm32-unknown-unknown --no-default-features

      - name: wasm-bindgen
        run: |
          wasm-bindgen --target web --out-dir target/wasm-pkg \
            target/wasm32-unknown-unknown/release/anyr_cli.wasm
          ls -la target/wasm-pkg

      - name: bench wasm size
        run: |
          python scripts/bench.py measure \
            --bin target/wasm-pkg/anyr_cli_bg.wasm \
            --asset anyr.wasm \
            --target wasm32-unknown-unknown \
            --kind wasm \
            --out bench/anyr.wasm.json

      - uses: actions/upload-artifact@v4
        with:
          name: bench-anyr.wasm
          path: bench/anyr.wasm.json

  # Live e2e against https://anyrouter.dev: models, one free chat, and a
  # private artifact publish + delete. Runs on main, on release-please PRs and
  # on manual dispatch; skipped on other PRs (forks have no secret).
  live-e2e:
    needs: [lint, changes]
    if: >-
      needs.changes.outputs.product == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'release-please--')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Real agents, old and new where their key handling differs. OpenCode 2
      # has no public build, so its fake in tests/e2e.rs covers it.
      - name: install real agents
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/agents"
          npm i --silent --no-audit --no-fund --prefix "$A/pi-new" @earendil-works/pi-coding-agent@latest
          npm i --silent --no-audit --no-fund --prefix "$A/pi-old" @mariozechner/pi-coding-agent@0.73.1
          npm i --silent --no-audit --no-fund --prefix "$A/opencode" opencode-ai@1
          npm i --silent --no-audit --no-fund --prefix "$A/claude" @anthropic-ai/claude-code@latest
          {
            printf 'ANYR_E2E_AGENTS='
            printf 'pi-new=pi=%s;' "$A/pi-new/node_modules/.bin/pi"
            printf 'pi-old=pi=%s;' "$A/pi-old/node_modules/.bin/pi"
            printf 'opencode-1=opencode=%s;' "$A/opencode/node_modules/.bin/opencode"
            printf 'claude=claude=%s\n' "$A/claude/node_modules/.bin/claude"
          } >> "$GITHUB_ENV"

      - name: cargo test --test e2e_live
        env:
          ANYROUTER_E2E_API_KEY: ${{ secrets.ANYROUTER_E2E_API_KEY }}
          ANYR_E2E_REQUIRED: "1"
        run: cargo test --locked --test e2e_live -- --test-threads=1 --nocapture

  report:
    needs: [build, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: compose markdown
        run: |
          python scripts/bench.py report artifacts \
            --out bench-report.md --json-out bench-report.json \
            --check-budget
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: |
            bench-report.md
            bench-report.json

      - name: comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- anyr-bench-report -->';
            const body = marker + '\n' + fs.readFileSync('bench-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  beta:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.product == 'true'
    # build no longer waits on lint or tests, so gate the publish on all of them.
    needs: [changes, lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(python3 scripts/stamp_beta_version.py --run "${{ github.run_number }}" --print)"
          TAG="v${VER}"
          mkdir -p dist
          find artifacts -type f \( -name 'anyr-*' -o -name 'anyr.exe' \) ! -name '*.json' -exec cp -v {} dist/ \;
          ( cd dist && sha256sum anyr-* > checksums.txt )
          ls -la dist
          ls -la dist/checksums.txt
          test -s dist/checksums.txt || { echo "checksums.txt missing or empty"; exit 1; }
          test -n "$(ls -A dist)" || { echo "no binaries in artifacts"; exit 1; }
          SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          printf 'Beta from main (%s).\n\ncurl -fsSL https://anyrouter.dev/cli.sh | bash -s -- --channel beta\nchannel: beta\n' "$SHORT" > notes.md
          gh release create "${TAG}" dist/* \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file notes.md

  # The installer and `anyr update` scrape github.com/releases. A repo
  # transfer once made both find zero tags, and nothing in CI noticed. This
  # runs the committed setup.sh against the live release just published, on Linux and
  # Apple Silicon (a killed macOS binary once shipped with every check green).
  install-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [beta]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `gh release create` returns before every CDN edge serves the new
      # assets, and an install that read "newest beta" too early got the
      # previous one. Wait for this run's own tag, then install it by name.
      - name: wait until this run's release is downloadable
        run: |
          set -euo pipefail
          WANT="$(python3 scripts/stamp_beta_version.py --run "${{ github.run_number }}" --print)"
          case "$RUNNER_OS" in
            Linux) FILES="anyr-linux-x86_64 anyr-linux-x86_64-musl checksums.txt" ;;
            macOS) FILES="anyr-darwin-arm64 checksums.txt" ;;
          esac
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${WANT}"
          served() {
            for f in $FILES; do curl -fsIL -o /dev/null "${BASE}/${f}" || return 1; done
          }
          for i in $(seq 0 36); do
            if served; then
              echo "v${WANT}: ${FILES} are served after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "v${WANT}: one of ${FILES} is still not served after 3 minutes"
          exit 1

      - name: install the beta with setup.sh and check the version
        run: |
          set -euo pipefail
          WANT="$(python3 scripts/stamp_beta_version.py --run "${{ github.run_number }}" --print)"
          export ANYR_BIN_DIR="$RUNNER_TEMP/bin" HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          # Twice into the same dir: the second run replaces a binary that has
          # already launched, the path where macOS can keep a stale signature.
          for run in 1 2; do
            bash setup.sh --channel beta --version "${WANT}"
            GOT="$("$ANYR_BIN_DIR/anyr" --version)"
            echo "run ${run}: want ${WANT}, got ${GOT}"
            case "$GOT" in "${WANT}"*) ;; *) echo "installed version is not the one just published"; exit 1;; esac
          done

      - name: install the beta on Alpine and check it picked the musl build
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          WANT="$(python3 scripts/stamp_beta_version.py --run "${{ github.run_number }}" --print)"
          docker run --rm -v "$PWD:/src:ro" -e WANT="$WANT" \
            -e ANYR_NO_UPDATE=1 -e ANYR_TELEMETRY=0 alpine:latest sh -euc '
              set -o pipefail
              apk add --no-cache -q bash curl
              ANYR_BIN_DIR=/opt/anyr bash /src/setup.sh --version "$WANT" 2>&1 | tee /tmp/setup.log
              grep -q "anyr-linux-x86_64-musl" /tmp/setup.log
              GOT="$(/opt/anyr/anyr --version)"
              echo "alpine: want $WANT, got $GOT"
              case "$GOT" in "$WANT"*) ;; *) exit 1 ;; esac'

      # The release listing anyr reads lags the release by up to a few
      # minutes (it once still showed the previous beta), so retry until it
      # lists this run's tag.
      - name: anyr update --check finds the same release
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home" ANYR_NO_UPDATE=
          WANT="$(python3 scripts/stamp_beta_version.py --run "${{ github.run_number }}" --print)"
          for i in $(seq 0 18); do
            OUT="$("$RUNNER_TEMP/bin/anyr" update --check --beta)"
            if echo "$OUT" | grep -q "latest:  ${WANT}"; then
              echo "$OUT"
              echo "listing shows ${WANT} after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "$OUT"
          echo "anyr update --check never listed ${WANT} in 3 minutes"
          exit 1
